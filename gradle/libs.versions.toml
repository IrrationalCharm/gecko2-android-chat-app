[versions]
agp = "9.0.1"
appauth = "0.11.1"
blurview = "version-2.0.3"
glide = "5.0.5"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
lifecycleProcess = "2.10.0"
material = "1.13.0"
retrofit = "3.0.0"
roomRuntime = "2.8.4"
rxandroid = "2.1.1"
rxjava = "2.2.21"
securityCrypto = "1.1.0"
stompprotocolandroid = "1.6.6"
playServicesAuth = "21.4.0"
activity = "1.8.0"
constraintlayout = "2.1.4"
tinkAndroid = "1.20.0"

[libraries]
appauth = { module = "net.openid:appauth", version.ref = "appauth" }
